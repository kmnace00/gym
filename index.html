<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="header" id="header">
    <div class="days" role="group" aria-label="Workout day">
      <button class="day active" type="button" data-day="fri">Fri</button>
      <button class="day" type="button" data-day="sat">Sat</button>
      <button class="day" type="button" data-day="sun">Sun</button>
    </div>
    <button class="backbtn" id="backBtn" type="button" aria-label="Back to lift list">‹ Back</button>
    <button class="menubtn" id="menuBtn" type="button" aria-label="Menu">⋯</button>
    <button class="undopill" id="undoPill" type="button" aria-label="Undo last set" hidden>Undo</button>
    <button class="pill" id="sessBtn" type="button" aria-label="Start or pause session timer">▶ <span class="startlbl">Start</span><span id="elapsed">0:00</span></button>
  </header>

  <div class="timer" id="timerBar">
    <div class="clock" id="restTime">Rest</div>
    <div class="tlabel" aria-live="polite"><strong id="restLabel"></strong><span id="restMsg">Starts after Set Done</span></div>
    <div class="rnext" id="restNext"></div>
    <div class="rbar" aria-hidden="true"><i id="rbarFill"></i></div>
    <div class="tbtns">
      <button id="plus15" type="button">+15</button>
      <button id="pauseRest" type="button">Pause</button>
      <button id="skipRest" type="button">End rest</button>
    </div>
    <div class="rnav">
      <button id="rPrevBtn" type="button" aria-label="Previous lift">‹</button>
      <button id="rNextBtn" type="button" aria-label="Next lift">›</button>
    </div>
    <button class="detailsbtn" id="detailsBtn" type="button" aria-expanded="false" data-show="Show workout" data-hide="Hide workout">Show workout</button>
    <button class="undobtn" id="undoBtn" type="button">Undo last set</button>
  </div>

  <section class="view" id="dayView" aria-label="Today's lifts">
    <div class="dayhead">
      <div class="daytitle" id="dayTitle">—</div>
      <div class="daysub" id="daySummary">—</div>
    </div>
    <ul class="liftlist" id="liftList"></ul>
    <div class="progress" id="progressSegs" aria-hidden="true"></div>
  </section>

  <section class="view" id="liftView" aria-label="Current lift">
    <div class="liftnav">
      <button class="mini" id="prevLift" type="button" aria-label="Previous lift">‹</button>
      <span class="liftstat" id="liftMeta">—</span>
      <button class="mini" id="nextLift" type="button" aria-label="Next lift">›</button>
    </div>
    <h1 id="exName">—</h1>
    <div class="pres" id="exPres">—</div>
    <p class="cue" id="exCue">—</p>
    <p class="tempo" id="tempoLine">Tempo — explode up · 2s down · 1s hold</p>
    <div class="setdots" aria-label="Sets">
      <div class="dotsline" id="setDots"></div>
      <button class="resetlift" id="resetLiftBtn" type="button" aria-label="Restart this lift">↺ Restart</button>
    </div>

    <div class="suggest" id="suggestLine" hidden><span id="suggestText"></span><button class="applybtn" id="applyLoad" type="button" hidden>Apply</button></div>
    <div class="sparkwrap" id="sparkWrap" hidden><svg class="spark" id="sparkline" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>

    <div class="adjust">
      <div class="steppers">
        <div class="ctl">
          <button class="stepbtn" type="button" id="loadDown" aria-label="Decrease load">−</button>
          <div class="mid"><span class="k">Load</span><span class="v" id="loadVal">—</span></div>
          <button class="stepbtn" type="button" id="loadUp" aria-label="Increase load">+</button>
        </div>
        <div class="ctl">
          <button class="stepbtn" type="button" id="repDown" aria-label="Decrease reps">−</button>
          <div class="mid"><span class="k">Reps</span><span class="v" id="repVal">—</span></div>
          <button class="stepbtn" type="button" id="repUp" aria-label="Increase reps">+</button>
        </div>
      </div>
      <p class="rirhint" id="rirHint" hidden>RIR = reps left in the tank · 0 = to failure</p>
      <div class="rirrow" id="rirRow" aria-label="Reps in reserve">
        <span class="k">RIR</span>
      </div>
    </div>

    <div class="hint" id="hint"></div>
    <button class="donebtn" id="doneBtn" type="button">Set Done</button>
  </section>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="modal-head"><strong>Menu</strong><button class="modalclose" id="modalClose" type="button" aria-label="Close">✕</button></div>
    <button class="modalbtn" id="exportCopy" type="button">Copy backup</button>
    <button class="modalbtn" id="exportDownload" type="button">Download JSON</button>
    <label class="modalbtn" id="importLabel">Import backup<input type="file" id="importFile" accept="application/json,text/plain" hidden></label>
    <div class="modalsep"></div>
    <button class="modalbtn" id="themeToggle" type="button">Theme: Dark</button>
    <button class="modalbtn" id="resetDay" type="button">Reset day</button>
    <button class="modalbtn modalbtn-danger" id="clearAll" type="button">Clear all data</button>
    <div class="modalmsg" id="modalMsg"></div>
    <div class="modalfoot" id="modalFoot"></div>
  </div>
</div>

<script src="program.js"></script>
<script src="store.js"></script>
<script src="timer.js"></script>
<script src="app.js"></script>
</body>
</html>
