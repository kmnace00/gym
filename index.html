<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym</title>
<link rel="icon" href="data:,">
<style>
/* ── design tokens — dark-first, light is an explicit opt-in ───────────── */
:root{
  --bg:#0b0e12; --surface:#151a21; --surface-2:#1d242d; --line:#28313b;
  --ink:#eef2f5; --muted:#9aa6b3; --faint:#68727e;
  --accent:#35d0b8; --accent-ink:#04231e; --accent-soft:rgba(53,208,184,.15);
  --good:#4ade80; --warn-bg:#3a2c0c; --warn:#fbbf24;
  --radius:16px; --radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --line:#e0e5ea;
  --ink:#0d1318; --muted:#5a6572; --faint:#8a95a1;
  --accent:#0d9488; --accent-ink:#ffffff; --accent-soft:rgba(13,148,136,.12);
  --good:#16a34a; --warn-bg:#fef3c7; --warn:#92400e;
  --shadow-sm:0 1px 3px rgba(0,0,0,.1);
}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.35;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ── shell ─────────────────────────────────────────────────────────────── */
.app{
  height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
}

/* ── header: day tabs (day view) / back (lift view) + theme + session ──── */
.header{display:flex;gap:10px;align-items:center;flex:none;min-width:0}
.days{display:flex;gap:3px;flex:1;min-width:0;background:var(--surface-2);border-radius:999px;padding:3px}
.day{
  flex:1;height:42px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);
  transition:background .2s ease,color .2s ease;
}
.day.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.day:active{filter:brightness(.96)}
.app.lift-mode .days{display:none}
.backbtn{
  display:none;flex:none;margin-right:auto;height:42px;padding:0 16px 0 12px;
  border-radius:999px;align-items:center;gap:6px;
  font-weight:700;font-size:14px;color:var(--ink);background:var(--surface-2);
}
.app.lift-mode .backbtn{display:inline-flex}
.themebtn{
  flex:none;width:42px;height:42px;border-radius:999px;display:grid;place-items:center;
  font-size:17px;color:var(--muted);
}
.pill{
  flex:none;min-height:42px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;background:transparent;
  transition:background .2s ease,color .2s ease;
}
.pill.on{color:var(--accent);background:var(--accent-soft)}
/* the elapsed readout is hidden until there is time worth reading */
.pill:not(.on):not(.has-time) #elapsed{display:none}
.pill.on .startlbl,.pill.has-time .startlbl{display:none}

/* ── views ─────────────────────────────────────────────────────────────── */
.view{flex:1;min-height:0;min-width:0;flex-direction:column}

/* ── day view: the 8-lift overview ─────────────────────────────────────── */
.dayhead{flex:none;display:flex;flex-direction:column;gap:2px;padding:0 4px 10px}
.daytitle{font-size:16px;font-weight:800;letter-spacing:-.01em}
.daysub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.liftlist{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.liftrow{
  flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:0 14px;
  transition:border-color .2s ease,background .2s ease,transform .08s ease;
}
.liftrow:active{transform:scale(.992)}
.liftrow.now{border-color:var(--accent);background:var(--accent-soft)}
.liftrow.done{opacity:.62}
.liftstatus{flex:none;width:20px;text-align:center;font-size:15px;font-weight:800;color:var(--accent)}
.liftmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.liftname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liftmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;font-size:20px;color:var(--faint);line-height:1}
.progress{flex:none;display:flex;gap:4px;height:6px;margin-top:8px}
.pseg{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pseg i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

/* ── lift view ─────────────────────────────────────────────────────────── */
.liftnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mini{width:44px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ink)}
.mini:active{background:var(--surface-2)}
.mini:disabled{opacity:.25}
.liftstat{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{
  flex:none;
  font-size:clamp(25px,6.6vw,31px);line-height:1.08;letter-spacing:-.02em;font-weight:800;
  margin:2px 0 6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pres{flex:none}
.pres .big{display:block;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pres .big b{color:var(--ink)}
.pres .small{display:block;margin-top:4px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cue{
  flex:none;font-size:15px;line-height:1.5;color:var(--muted);margin:9px 0 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.tempo{flex:none;font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--faint);margin:4px 0 0;font-variant-numeric:tabular-nums;opacity:.85}
.setdots{flex:none;display:flex;gap:10px;margin:16px 0 0;align-items:center}
.sdot{width:13px;height:13px;border-radius:50%;background:var(--line)}
.sdot.done{background:var(--accent)}
.sdot.now{width:16px;height:16px;background:transparent;border:2.5px solid var(--ink)}
.setcount{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* adjust cluster — always visible on the lift view, no hidden toggle */
.adjust{flex:none;margin-top:auto;padding-top:14px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px;display:flex;align-items:center;justify-content:space-between;gap:2px}
.stepbtn{
  width:44px;height:44px;flex:none;border-radius:50%;
  background:var(--surface-2);font-size:22px;font-weight:700;line-height:1;
  display:grid;place-items:center;-webkit-touch-callout:none;
}
.stepbtn:active{filter:brightness(1.2)}
.ctl .mid{text-align:center;min-width:0}
.ctl .k{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ctl .v{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.rirrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.rirrow .k{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--faint);margin-right:2px}
.rir{
  flex:1;height:44px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.rir.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hint{display:none;margin-top:12px;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.35}
.hint.show{display:block;background:var(--warn-bg);color:var(--warn)}
.hint.good{background:var(--accent-soft);color:var(--accent)}
.donebtn{
  flex:none;margin-top:12px;width:100%;height:60px;border-radius:14px;
  background:var(--ink);color:var(--bg);font-size:18px;font-weight:800;letter-spacing:.01em;
  transition:transform .08s ease,opacity .08s ease;
}
.donebtn:active{opacity:.88;transform:scale(.985)}
.donebtn.complete{background:var(--surface-2);color:var(--accent)}

/* ── rest timer: a strip when peeking, the whole screen while counting ─── */
.timer{
  display:none;flex:none;border-radius:var(--radius);padding:10px 14px;
  align-items:center;gap:12px;background:var(--surface);color:var(--muted);
  transition:background .25s ease,color .25s ease;
}
.timer.active{display:flex}
.timer.go{cursor:pointer}
.timer.paused .clock{opacity:.5}
/* Pause is meaningless at GO — the button is inert there (pauseBtn ignores .go),
   so it must not sit on screen looking tappable. */
.timer.go #pauseRest{display:none}
.timer .clock{font-size:20px;font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer .tlabel{flex:1;min-width:0;font-size:13px}
.timer .tlabel strong{display:block;font-weight:700;color:var(--ink);font-size:13.5px}
.timer .tlabel span{display:block;opacity:.75}
.timer .rnext{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.timer .tbtns{display:none;gap:8px;flex:none}
.timer.active .tbtns{display:flex}
.timer .tbtns button{
  height:42px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px;
}
.timer .rbar{display:none}
.timer .rnav{display:none}
.timer .detailsbtn,.timer .undobtn{display:none}
.timer .tbtns #pauseRest{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;opacity:.7;padding:0 8px;font-weight:600}

/* full-screen rest focus */
.app.resting .timer{
  flex:1;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:16px;padding:28px 22px;border-radius:20px;
}
.app.resting .timer .clock{font-size:clamp(80px,25vw,118px);font-weight:800;line-height:.95;min-width:0}
.app.resting .timer .tlabel{flex:none;text-align:center;font-size:14px}
.app.resting .timer .tlabel strong{display:block;font-size:18px}
.app.resting .timer .tlabel span{margin-top:4px}
.app.resting .timer .tbtns{display:flex;gap:10px}
.app.resting .timer .tbtns button{height:50px;padding:0 22px;font-size:15px}
.app.resting .timer .tbtns #pauseRest{height:44px;padding:0 8px;font-size:13.5px}
.app.resting .timer .rbar{
  display:block;width:100%;max-width:340px;height:7px;border-radius:99px;
  background:var(--surface-2);overflow:hidden;order:2;
}
.app.resting .timer .rbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s linear}
.app.resting .timer .rnext{display:block;font-size:15px;max-width:360px;order:4}
.app.resting .timer .clock{order:1}
.app.resting .timer .tlabel{order:3}
.app.resting .timer .tbtns{order:5}
.app.resting .timer .rnav{
  display:flex;gap:10px;align-items:center;justify-content:center;order:6;
}
.app.resting .timer .rnav button{
  width:54px;height:44px;border-radius:999px;flex:none;
  border:1px solid var(--line);background:transparent;color:inherit;
  font-size:20px;font-weight:700;
}
.app.resting .timer .rnav button:disabled{opacity:.25}
.app.resting .timer .detailsbtn,.app.resting .timer .undobtn{
  display:inline-flex;height:44px;padding:0 12px;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:600;color:inherit;opacity:.7;
  text-decoration:underline;text-underline-offset:3px;
}
.app.resting .timer .detailsbtn{order:7}
.app.resting .timer .undobtn{order:8;display:none}
.app.resting.can-undo .timer .undobtn{display:inline-flex}
.app.resting .timer.paused .tlabel strong::after{content:" — paused";font-weight:600;opacity:.75}

/* GO: one unmistakable, tappable advance screen */
.app.resting .timer.go{background:var(--accent);color:var(--accent-ink)}
.app.resting .timer.go .clock,.app.resting .timer.go .tlabel,.app.resting .timer.go .tlabel strong,
.app.resting .timer.go .rnext{color:var(--accent-ink)}
.app.resting .timer.go .rbar{background:rgba(0,0,0,.18)}
.app.resting .timer.go .rbar i{background:var(--accent-ink)}
.app.resting .timer.go .tbtns button{border-color:var(--accent-ink);color:var(--accent-ink)}
.app.resting .timer.go #skipRest{background:var(--accent-ink);color:var(--accent);border-color:transparent}

/* peeked details: timer shrinks back to a strip, workout returns behind it */
.app.resting.show-details .timer{
  flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;
  text-align:left;gap:8px;padding:10px 12px;border-radius:14px;
}
.app.resting.show-details .timer .clock{font-size:32px;min-width:70px;order:1}
/* the label must keep real width — flex-basis 0 let it shrink to a sliver
   earlier and wrap one word per line into a 281px column, which then forced
   the whole strip (and the lift view below it) off-screen */
.app.resting.show-details .timer .tlabel{flex:1 1 auto;min-width:0;text-align:left;order:2}
.app.resting.show-details .timer .tlabel strong{white-space:normal;overflow:visible;text-overflow:clip;display:block;font-size:13.5px;line-height:1.2}
.app.resting.show-details .timer .tlabel span{display:block;font-size:12px;line-height:1.2}
/* the peek is a two-row strip: clock + label + Hide workout, then the
   actions on their own full-width row. Progress bar, what's-next, the ‹ ›
   pair and Undo stay on the full rest screen, so the strip stays short
   enough that the lift view keeps its name and Set Done at 390×667. */
.app.resting.show-details .timer .rnext,
.app.resting.show-details .timer .rbar,
.app.resting.show-details .timer .rnav,
.app.resting.show-details .timer .undobtn{display:none}
.app.resting.show-details .timer .detailsbtn{order:3;flex:0 0 auto;width:auto;height:42px;padding:0 10px;justify-content:center;align-self:center}
.app.resting.show-details .timer .tbtns{order:4;flex:1 1 100%;display:flex}
.app.resting.show-details .timer .tbtns button{flex:1;height:40px;padding:0 8px;font-size:12.5px}

/* ── responsive: short phones keep everything on one screen ────────────── */
@media (max-height:720px){
  .app{gap:8px;padding-top:9px}
  .dayhead{padding-bottom:6px}
  .liftlist{gap:5px}
  h1{font-size:23px;margin:0 0 4px}
  .pres .big{font-size:22px}
  .pres .small{font-size:12.5px;margin-top:2px}
  .cue{font-size:13.5px;line-height:1.4;margin-top:6px}
  .tempo{margin-top:3px}
  .setdots{margin-top:10px}
  .adjust{padding-top:8px}
  .stepbtn{width:40px;height:40px;font-size:20px}
  .rir{height:40px}
  .donebtn{height:52px;margin-top:8px;font-size:17px}
  .app.resting .timer .clock{font-size:72px}
  .app.resting .timer{gap:11px;padding:20px 16px}
  .app.resting.show-details .timer .clock{font-size:32px;min-width:74px}
  /* peek at short heights: trim the lift block so Set Done stays on-screen */
  .app.resting.show-details .cue{-webkit-line-clamp:2}
}
@media (min-height:820px){
  .dayhead{padding-bottom:12px}
  .liftlist{gap:8px}
  h1{font-size:32px}
  .pres .big{font-size:29px}
  .donebtn{height:66px;font-size:19px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="header" id="header">
    <div class="days" role="group" aria-label="Workout day">
      <button class="day active" type="button" data-day="fri">Fri</button>
      <button class="day" type="button" data-day="sat">Sat</button>
      <button class="day" type="button" data-day="sun">Sun</button>
    </div>
    <button class="backbtn" id="backBtn" type="button" aria-label="Back to lift list">‹ Lifts</button>
    <button class="themebtn" id="themeBtn" type="button" aria-label="Toggle theme">☾</button>
    <button class="pill" id="sessBtn" type="button" aria-label="Start or pause session timer">▶ <span class="startlbl">Start</span><span id="elapsed">0:00</span></button>
  </header>

  <div class="timer" id="timerBar">
    <div class="clock" id="restTime">Rest</div>
    <div class="tlabel" aria-live="polite"><strong id="restLabel"></strong><span id="restMsg">Starts after Set Done</span></div>
    <div class="rnext" id="restNext"></div>
    <div class="rbar" aria-hidden="true"><i id="rbarFill"></i></div>
    <div class="tbtns">
      <button id="plus15" type="button">+15</button>
      <button id="pauseRest" type="button">Pause</button>
      <button id="skipRest" type="button">End rest</button>
    </div>
    <div class="rnav">
      <button id="rPrevBtn" type="button" aria-label="Previous lift">‹</button>
      <button id="rNextBtn" type="button" aria-label="Next lift">›</button>
    </div>
    <button class="detailsbtn" id="detailsBtn" type="button" aria-expanded="false" data-show="Show workout" data-hide="Hide workout">Show workout</button>
    <button class="undobtn" id="undoBtn" type="button">Undo last set</button>
  </div>

  <section class="view" id="dayView" aria-label="Today's lifts">
    <div class="dayhead">
      <div class="daytitle" id="dayTitle">—</div>
      <div class="daysub" id="daySummary">—</div>
    </div>
    <ul class="liftlist" id="liftList"></ul>
    <div class="progress" id="progressSegs" aria-hidden="true"></div>
  </section>

  <section class="view" id="liftView" aria-label="Current lift">
    <div class="liftnav">
      <button class="mini" id="prevLift" type="button" aria-label="Previous lift">‹</button>
      <span class="liftstat" id="liftMeta">—</span>
      <button class="mini" id="nextLift" type="button" aria-label="Next lift">›</button>
    </div>
    <h1 id="exName">—</h1>
    <div class="pres" id="exPres">—</div>
    <p class="cue" id="exCue">—</p>
    <p class="tempo" id="tempoLine">Tempo — explode up · 2s down · 1s hold</p>
    <div class="setdots" id="setDots" aria-label="Sets"></div>

    <div class="adjust">
      <div class="steppers">
        <div class="ctl">
          <button class="stepbtn" type="button" id="loadDown" aria-label="Decrease load">−</button>
          <div class="mid"><span class="k">Load</span><span class="v" id="loadVal">—</span></div>
          <button class="stepbtn" type="button" id="loadUp" aria-label="Increase load">+</button>
        </div>
        <div class="ctl">
          <button class="stepbtn" type="button" id="repDown" aria-label="Decrease reps">−</button>
          <div class="mid"><span class="k">Reps</span><span class="v" id="repVal">—</span></div>
          <button class="stepbtn" type="button" id="repUp" aria-label="Increase reps">+</button>
        </div>
      </div>
      <div class="rirrow" id="rirRow" aria-label="Reps in reserve">
        <span class="k">RIR</span>
      </div>
    </div>

    <div class="hint" id="hint"></div>
    <button class="donebtn" id="doneBtn" type="button">Set Done</button>
  </section>

</div>

<script>
/* ── program data — unchanged from the original tool ───────────────────── */
var DAYS={
fri:{label:"Friday — Push + Quads",ex:[
{n:"Smith squat",s:3,r:6,top:6,load:60,step:2.5,rest:180,rir:2,cue:"Bar over mid-foot, heels flat."},
{n:"Smith incline press",s:3,r:6,top:6,load:50,step:2.5,rest:120,rir:2,cue:"Bench ~30°. Bar to upper chest."},
{n:"Bulgarian split squat",s:3,r:8,top:8,load:25,step:2.5,rest:120,rir:2,cue:"Per leg. Upright = more quad."},
{n:"Incline DB press",s:3,r:7,top:8,load:52.5,step:2.5,rest:120,rir:2,cue:"Lower to a stretch, don't drift wide."},
{n:"Pec deck fly",s:3,r:8,top:10,load:100,step:5,rest:90,rir:1,partial:1,cue:"Handles at mid-chest, elbows fixed."},
{n:"Leg extension",s:3,r:12,top:15,load:null,step:2.5,rest:90,rir:1,partial:1,cue:"Start light, log the stack."},
{n:"Cable lateral raise",s:3,r:10,top:12,load:10,step:1,rest:90,rir:1,partial:1,cue:"Per side. Arm across body, lead with elbow."},

/* ── helpers ───────────────────────────────────────────────────────────── */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

/* ── state + persistence ───────────────────────────────────────────────── */
var STORE="gym-tool-v1", THEME_KEY="gym-theme";
/* open on today's workout; Mon–Thu (off days) land on Fri, the next session */
var cur=(function(){var d=new Date().getDay();return d===6?"sat":(d===0?"sun":"fri");})();
var idx=0, state={}, hintText="", hintGood=false, view="day";
function st(d,i){
  var k=d+":"+i, e=DAYS[d].ex[i], s=state[k];
  if(!s){ s=state[k]={done:0,load:e.load||0,reps:e.r,rir:e.rir,topHits:0,lastRir:null}; }
  else{
    if(typeof s.done!=="number")s.done=0;
    if(typeof s.load!=="number")s.load=e.load||0;
    if(typeof s.reps!=="number")s.reps=e.r;
    if(typeof s.rir!=="number")s.rir=e.rir;
    if(typeof s.topHits!=="number")s.topHits=0;
    if(!("lastRir" in s))s.lastRir=null;
  }
  return s;
}
function save(){
  try{ localStorage.setItem(STORE,JSON.stringify({v:1,cur:cur,idx:idx,state:state})); }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(STORE); if(!raw)return;
    var p=JSON.parse(raw); if(!p||p.v!==1)return;
    if(p.state&&typeof p.state==="object")state=p.state;
    if(p.cur&&DAYS[p.cur])cur=p.cur;
    if(typeof p.idx==="number"&&p.idx>=0&&p.idx<DAYS[cur].ex.length)idx=p.idx;
  }catch(e){}
}

/* ── day math (same model as the original tool) ────────────────────────── */
function dayMins(d){
  var t=0, list=DAYS[d].ex;
  list.forEach(function(e){ t+=e.s*50 + e.s*e.rest; });
  t+=(list.length-1)*60;
  return Math.round(t/60);
}
function dayMinsLeft(d){
  var t=0, liftsLeft=0, list=DAYS[d].ex;
  list.forEach(function(e,i){
    var rem=e.s-Math.min(st(d,i).done,e.s);
    if(rem>0){ t+=rem*50 + rem*e.rest; liftsLeft++; }
  });
  t+=Math.max(0,liftsLeft-1)*60;
  return Math.round(t/60);
}
function ex(){return DAYS[cur].ex[idx];}
function curSt(){return st(cur,idx);}

/* ── theme ─────────────────────────────────────────────────────────────── */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content", t==="light"?"#f4f6f8":"#0b0e12");
  var b=document.getElementById("themeBtn");
  if(b){
    b.textContent = t==="light" ? "☀" : "☾";
    b.setAttribute("aria-label", t==="light" ? "Switch to dark theme" : "Switch to light theme");
  }
}
function initTheme(){
  var t="dark";
  try{ var saved=localStorage.getItem(THEME_KEY); if(saved==="light"||saved==="dark")t=saved; }catch(e){}
  applyTheme(t);
}
document.getElementById("themeBtn").onclick=function(){
  var t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  applyTheme(t);
};

/* ── visibility: only one view (and the right chrome) shows at a time ──── */
function applyVisibility(){
  var resting=appEl.classList.contains("resting");
  var peek=appEl.classList.contains("show-details");
  var showCurrent=!resting||peek;
  dayView.style.display=(showCurrent&&view==="day")?"flex":"none";
  liftView.style.display=(showCurrent&&view==="lift")?"flex":"none";
  header.style.display=(resting&&!peek)?"none":"flex";
}

/* ── render ────────────────────────────────────────────────────────────── */
function syncDays(){
  document.querySelectorAll(".day").forEach(function(b){
    var on=b.getAttribute("data-day")===cur;
    b.classList.toggle("active",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
}
function renderDay(){
  var list=DAYS[cur].ex, totalDone=0, totalSets=0;
  list.forEach(function(x,i){ totalDone+=Math.min(st(cur,i).done,x.s); totalSets+=x.s; });
  document.getElementById("dayTitle").textContent=DAYS[cur].label;
  document.getElementById("daySummary").textContent=(totalSets>0&&totalDone>=totalSets)
    ? "Workout complete — nice work"
    : "8 lifts · "+totalSets+" sets · ~"+(totalDone>0?dayMinsLeft(cur):dayMins(cur))+" min"+(totalDone>0?" left":" total");

  var rows="";
  list.forEach(function(e,i){
    var s=st(cur,i), done=s.done>=e.s;
    var loadTxt = e.load===null ? (s.load>0?"Load "+s.load:"start light")
                 : e.load===0 ? "bodyweight" : "Load "+s.load;
    var restTxt = fmt(e.rest+(s.rir<=1?30:0));
    rows += '<li class="liftrow'+(done?" done":"")+(i===idx?" now":"")+'" data-i="'+i+'" role="button" tabindex="0">'
      + '<span class="liftstatus">'+(done?"✓":"")+'</span>'
      + '<span class="liftmain"><span class="liftname">'+esc(e.n)+'</span>'
      + '<span class="liftmeta">'+e.s+'×'+e.r+(e.top>e.r?"–"+e.top:"")+' · '+loadTxt+' · '+restTxt+' rest</span></span>'
      + '<span class="chev">›</span></li>';
  });
  liftList.innerHTML=rows;

  var segs="";
  list.forEach(function(e,i){
    var s=st(cur,i);
    var pct=Math.max(0,Math.min(1,s.done/e.s));
    segs+='<span class="pseg"><i style="width:'+(pct*100)+'%"></i></span>';
  });
  document.getElementById("progressSegs").innerHTML=segs;
  save();
}
function renderLift(){
  var e=ex(), s=curSt(), list=DAYS[cur].ex;
  var anyDone=false;
  list.forEach(function(x,i){ if(st(cur,i).done>0)anyDone=true; });
  document.getElementById("liftMeta").textContent="Lift "+(idx+1)+" of "+list.length+" · ~"+(anyDone?dayMinsLeft(cur):dayMins(cur))+" min";
  document.getElementById("exName").textContent=e.n;

  var rirTxt=(e.partial&&s.done===e.s-1)?"0–1 RIR · last set":s.rir+" RIR";
  var loadBig = e.load===null
    ? (s.load>0?"Load <b>"+s.load+"</b>":"start light")
    : (e.load===0?"bodyweight":"Load <b>"+s.load+"</b>");
  var effRest=e.rest+(s.rir<=1?30:0);
  document.getElementById("exPres").innerHTML=
    "<span class='big'><b>"+s.reps+(e.top>s.reps?"–"+e.top:"")+"</b> reps · "+loadBig+"</span>"
    +"<span class='small'>"+rirTxt+" · Rest "+fmt(effRest)+"</span>";
  document.getElementById("exCue").textContent=e.cue;
  document.getElementById("tempoLine").style.display=idx===0?"":"none";

  var complete=s.done>=e.s;
  var dots="";
  for(var k=0;k<e.s;k++){ dots+='<span class="sdot'+(k<s.done?" done":(k===s.done?" now":""))+'"></span>'; }
  dots+='<span class="setcount">'+(complete?("All "+e.s+" sets done"):("Set "+(s.done+1)+" of "+e.s))+'</span>';
  document.getElementById("setDots").innerHTML=dots;

  document.getElementById("loadVal").textContent=(e.load===null&&s.load===0)?"—":s.load;
  document.getElementById("repVal").textContent=s.reps;
  rirRow.querySelectorAll(".rir").forEach(function(b){
    b.classList.toggle("active",s.rir===parseInt(b.getAttribute("data-rir"),10));
  });

  var btn=document.getElementById("doneBtn");
  btn.classList.toggle("complete",complete);
  btn.textContent=complete?"✓ Done — tap for extra set":"Set Done";

  var hint=document.getElementById("hint");
  hint.textContent=hintText;
  hint.className="hint"+(hintText?" show":"")+(hintGood?" good":"");

  var last=idx===list.length-1;
  document.getElementById("prevLift").disabled=idx===0;
  document.getElementById("nextLift").disabled=last;
  /* the rest-screen pair forwards to these same buttons, so it must mirror
     their disabled state or the arrows look live but do nothing at the ends */
  rPrevBtn.disabled=idx===0;
  rNextBtn.disabled=last;
  save();
}
function render(){
  appEl.classList.toggle("lift-mode",view==="lift");
  syncDays();
  applyVisibility();
  if(view==="day")renderDay(); else renderLift();
}

/* ── rest timer (timestamp-based: honest even if the phone sleeps) ─────── */
var rLeft=0, rInt=null, rEnd=0, rTotal=0, rLabel="", pendingNext=false, pendingIdx=-1, pendingDay="", lastAction=null, rPaused=false, rNote="", rNextText="";

function blurRestNav(){
  if(document.activeElement===rPrevBtn||document.activeElement===rNextBtn){
    document.activeElement.blur();
  }
}
function resetPause(){
  rPaused=false;
  timerBar.classList.remove("paused");
  pauseBtn.textContent="Pause";
}
function setRestLabel(t,m){
  document.getElementById("restLabel").textContent=t;
  document.getElementById("restMsg").textContent=m;
}
function setRestDetails(open){
  if(open)blurRestNav();
  appEl.classList.toggle("show-details",!!open);
  detailsBtn.textContent=detailsBtn.getAttribute(open?"data-hide":"data-show");
  detailsBtn.setAttribute("aria-expanded",open?"true":"false");
  applyVisibility();
}
detailsBtn.onclick=function(){
  setRestDetails(!appEl.classList.contains("show-details"));
};
function timerIdle(label,msg){
  if(timerBar.contains(document.activeElement))document.activeElement.blur();
  timerBar.classList.remove("active","go");
  appEl.classList.remove("resting");
  setRestDetails(false);
  pendingIdx=-1; pendingDay="";
  resetPause();
  skipBtn.textContent="End rest";
  document.getElementById("restTime").textContent="Rest";
  document.getElementById("restTime").removeAttribute("aria-label");
  document.getElementById("rbarFill").style.width="0";
  document.getElementById("restNext").textContent="";
  setRestLabel(label||"",msg||"Starts after Set Done");
  applyVisibility();
}
function updateRbar(){
  var f=rTotal>0?1-(rLeft/rTotal):0;
  document.getElementById("rbarFill").style.width=Math.max(0,Math.min(100,f*100))+"%";
}
/* the AudioContext is created/resumed on the Set Done tap (a user gesture) */
var actx=null;
function ensureAudio(){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
  }catch(e){}
}
function beepGo(){
  if(!actx)return;
  try{
    var t=actx.currentTime;
    [0,0.22].forEach(function(off){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t+off);
      g.gain.exponentialRampToValueAtTime(0.22,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.16);
      o.start(t+off); o.stop(t+off+0.18);
    });
  }catch(e){}
}
function finishRest(){
  clearInterval(rInt); rInt=null; rLeft=0;
  resetPause();
  document.getElementById("restTime").textContent="GO";
  document.getElementById("restTime").setAttribute("aria-label","Rest complete — GO");
  document.getElementById("rbarFill").style.width="100%";
  var rn=document.getElementById("restNext");
  rn.textContent=rn.textContent.replace("Up next —","Up now —");
  timerBar.classList.add("go");
  var adv=pendingNext&&cur===pendingDay&&idx===pendingIdx;
  skipBtn.textContent=adv?(idx<DAYS[cur].ex.length-1?"Next lift":"Finish"):"Start next set";
  setRestLabel("GO",adv?(idx<DAYS[cur].ex.length-1?"Lift done — next up.":"Workout complete — nice work."):"Next set — go.");
  if(navigator.vibrate)navigator.vibrate(200);
  beepGo();
}
function tickRest(){
  rLeft=Math.max(0,Math.ceil((rEnd-Date.now())/1000));
  document.getElementById("restTime").textContent=fmt(rLeft);
  updateRbar();
  if(rLeft<=0)finishRest();
}
function startRest(sec,label,lastSet,note,nextText){
  clearInterval(rInt); rTotal=sec; rEnd=Date.now()+sec*1000; rLeft=sec; rLabel=label; pendingNext=!!lastSet;
  if(pendingNext&&pendingIdx<0){ pendingIdx=idx; pendingDay=cur; }
  rNote=note||""; rNextText=nextText||"";
  document.getElementById("restNext").textContent=rNextText;
  document.getElementById("restTime").setAttribute("aria-label","Rest time remaining");
  timerBar.classList.add("active"); timerBar.classList.remove("go");
  appEl.classList.add("resting");
  if(document.activeElement&&!timerBar.contains(document.activeElement))document.activeElement.blur();
  setRestDetails(false);
  resetPause();
  skipBtn.textContent="End rest";
  document.getElementById("restTime").textContent=fmt(rLeft);
  updateRbar();
  var msg = note==="partials"
    ? "Add bottom-half partials to failure — then rest."
    : "Stretch — set up the next set.";
  if(sec>ex().rest)msg="+30s for 0–1 RIR · "+msg;
  setRestLabel(label,msg);
  applyVisibility();
  rInt=setInterval(tickRest,200);
}
document.getElementById("plus15").onclick=function(){
  if(!timerBar.classList.contains("active"))return;
  if(!rInt&&!rPaused&&rLeft<=0){ startRest(15,rLabel,pendingNext,rNote,rNextText); return; }
  timerBar.classList.remove("go");
  skipBtn.textContent="End rest";
  if(rPaused){
    rLeft+=15; rTotal+=15;
    document.getElementById("restTime").textContent=fmt(rLeft);
    updateRbar();
    return;
  }
  rEnd+=15000; rTotal+=15; tickRest();
};
pauseBtn.onclick=function(){
  if(!timerBar.classList.contains("active")||timerBar.classList.contains("go"))return;
  if(rPaused){
    rPaused=false;
    timerBar.classList.remove("paused");
    pauseBtn.textContent="Pause";
    rEnd=Date.now()+rLeft*1000;
    rInt=setInterval(tickRest,200);
    tickRest();
    return;
  }
  if(!rInt)return;
  rLeft=Math.max(0,Math.ceil((rEnd-Date.now())/1000));
  clearInterval(rInt); rInt=null;
  rPaused=true;
  timerBar.classList.add("paused");
  pauseBtn.textContent="Resume";
  document.getElementById("restTime").textContent=fmt(rLeft);
  updateRbar();
};
/* at GO the whole timer surface is the advance button */
timerBar.addEventListener("click",function(ev){
  if(!timerBar.classList.contains("go"))return;
  if(ev.target.closest("button"))return;
  skipBtn.click();
});
function clearUndo(){
  lastAction=null;
  appEl.classList.remove("can-undo");
}
skipBtn.onclick=function(){
  var wasGo=timerBar.classList.contains("go");
  clearInterval(rInt); rInt=null; rLeft=0;
  resetPause();
  clearUndo();
  if(pendingNext&&cur===pendingDay&&idx===pendingIdx){
    pendingNext=false;
    if(idx<DAYS[cur].ex.length-1){
      idx++; hintText=""; hintGood=false;
      timerIdle("","Next lift — go."); render();
    }else{
      timerIdle("","Workout complete — nice work.");
      if(sInt){ pauseSession(); sAutoStopped=true; }
    }
    return;
  }
  pendingNext=false;
  timerIdle("",wasGo?"Next set — go.":"Skipped — next set, go.");
};
undoBtn.onclick=function(){
  if(!lastAction)return;
  var a=lastAction; lastAction=null;
  var s=st(a.day,a.i);
  s.done=a.done; s.topHits=a.topHits; s.lastRir=a.lastRir;
  clearInterval(rInt); rInt=null; rLeft=0; pendingNext=false;
  resetPause();
  appEl.classList.remove("can-undo");
  hintText=""; hintGood=false;
  timerIdle("","Set undone — ready when you are.");
  render();
};

/* ── session timer ─────────────────────────────────────────────────────── */
var sSec=0, sInt=null, sBase=0, sStart=0;
var sAutoStopped=false;
function tickSession(){
  sSec=sBase+Math.floor((Date.now()-sStart)/1000);
  var el=document.getElementById("elapsed");
  if(el)el.textContent=fmt(sSec);
  if(sSec>0)sessBtn.classList.add("has-time");
}
function pauseSession(){
  tickSession();
  clearInterval(sInt); sInt=null; sBase=sSec;
  releaseAwake();
  sessBtn.classList.remove("on");
  sessBtn.innerHTML="▶ <span class='startlbl'>Start</span><span id='elapsed'>"+fmt(sSec)+"</span>";
}
sessBtn.onclick=function(){
  if(sInt){ pauseSession(); sAutoStopped=false; return; }
  sAutoStopped=false;
  sessBtn.classList.add("on");
  sessBtn.innerHTML="⏸ <span id='elapsed'>"+fmt(sSec)+"</span>";
  sStart=Date.now();
  sInt=setInterval(tickSession,500);
  keepAwake();
};

/* ── wake lock — best effort, silent if unavailable ────────────────────── */
var wakeLock=null;
function keepAwake(){
  if(!("wakeLock" in navigator))return;
  if(wakeLock&&!wakeLock.released)return;
  navigator.wakeLock.request("screen").then(function(w){
    wakeLock=w;
    w.addEventListener("release",function(){ if(wakeLock===w)wakeLock=null; });
  }).catch(function(){});
}
function releaseAwake(){
  if(!wakeLock)return;
  var w=wakeLock; wakeLock=null;
  try{ var p=w.release(); if(p&&p.catch)p.catch(function(){}); }catch(e){}
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&sInt)keepAwake();
});

/* ── RIR picker — built once ───────────────────────────────────────────── */
for(var ri=0;ri<=4;ri++){
  (function(rv){
    var b=document.createElement("button");
    b.type="button"; b.className="rir"; b.textContent=rv; b.setAttribute("data-rir",rv);
    b.setAttribute("aria-label","RIR "+rv);
    b.onclick=function(){curSt().rir=rv; save(); render();};
    rirRow.appendChild(b);
  })(ri);
}

/* ── steppers — tap once, press-and-hold repeats ───────────────────────── */
function stepLoad(d){
  var s=curSt();
  s.load=d<0?Math.max(0,Math.round((s.load-ex().step)*100)/100):Math.round((s.load+ex().step)*100)/100;
  save(); render();
}
function stepReps(d){var s=curSt(); s.reps=Math.max(1,s.reps+d); save(); render();}
function bindStepper(id,fn){
  var b=document.getElementById(id), delay=null, rep=null, held=false;
  function stop(){
    if(delay){clearTimeout(delay); delay=null;}
    if(rep){clearInterval(rep); rep=null;}
  }
  b.addEventListener("pointerdown",function(){
    held=false; stop();
    delay=setTimeout(function(){ delay=null; fn(); held=true; rep=setInterval(fn,70); },400);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ b.addEventListener(ev,stop); });
  b.addEventListener("click",function(){ if(held){held=false;return;} fn(); });
}
bindStepper("loadDown",function(){stepLoad(-1);});
bindStepper("loadUp",function(){stepLoad(1);});
bindStepper("repDown",function(){stepReps(-1);});
bindStepper("repUp",function(){stepReps(1);});

/* ── set done ──────────────────────────────────────────────────────────── */
document.getElementById("doneBtn").onclick=function(){
  var e=ex(), s=curSt();
  var wasComplete=s.done>=e.s;
  lastAction={day:cur,i:idx,done:s.done,topHits:s.topHits,lastRir:s.lastRir};
  appEl.classList.add("can-undo");
  s.done++; s.lastRir=s.rir;
  if(s.reps>=e.top&&s.rir>=e.rir)s.topHits++;

  hintText=""; hintGood=false;
  var finished=!wasComplete&&s.done>=e.s;
  var restNote="";
  if(finished&&e.partial&&s.lastRir<=1){
    restNote="partials";
  }else if(finished&&s.topHits>=1&&s.reps>=e.top&&s.lastRir>=e.rir){
    hintText=e.n+": top reps at target RIR — do it again next session to add weight.";
    hintGood=true;
  }

  var list=DAYS[cur].ex, nextText="";
  if(s.done>=e.s){
    var nx=list[idx+1];
    var nxLoad=!nx?"":nx.load===null
      ? (st(cur,idx+1).load>0?" · Load "+st(cur,idx+1).load:" · start light")
      : nx.load===0?" · bodyweight":" · Load "+st(cur,idx+1).load;
    nextText=nx?"Up next — "+nx.n+" · "+nx.s+" × "+nx.r+(nx.top>nx.r?"–"+nx.top:"")+nxLoad:"Last lift done — workout complete";
  }else{
    nextText="Up next — Set "+(s.done+1)+" of "+e.s+" · "+s.reps+" reps"+
      (e.load===null?(s.load>0?" · load "+s.load:" · start light"):(e.load===0?" · bodyweight":" · load "+s.load));
  }

  pendingIdx=-1; pendingDay="";
  startRest(e.rest+(s.rir<=1?30:0), e.n+" — set "+Math.min(s.done,e.s)+" done", s.done>=e.s, restNote, nextText);

  ensureAudio();
  if(navigator.vibrate)navigator.vibrate(10);
  if(!sInt&&(sSec===0||sAutoStopped))sessBtn.click();
  keepAwake();
  render();
};

/* ── navigation ────────────────────────────────────────────────────────── */
function showDay(){
  view="day"; hintText=""; hintGood=false; clearUndo();
  render();
}
function openLift(i){
  if(i<0||i>=DAYS[cur].ex.length)return;
  idx=i; view="lift"; hintText=""; hintGood=false; clearUndo(); render();
}
document.getElementById("backBtn").onclick=showDay;
liftList.addEventListener("click",function(ev){
  var row=ev.target.closest(".liftrow"); if(!row)return;
  openLift(parseInt(row.getAttribute("data-i"),10));
});
liftList.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter"&&ev.key!==" ")return;
  var row=ev.target.closest(".liftrow"); if(!row)return;
  ev.preventDefault(); openLift(parseInt(row.getAttribute("data-i"),10));
});
document.getElementById("prevLift").onclick=function(){ if(idx>0){ idx--; hintText=""; hintGood=false; clearUndo(); render(); } };
document.getElementById("nextLift").onclick=function(){ if(idx<DAYS[cur].ex.length-1){ idx++; hintText=""; hintGood=false; clearUndo(); render(); } };
/* rest-screen pair forwards to the lift nav so there is one copy of the logic */
rPrevBtn.onclick=function(){ document.getElementById("prevLift").click(); };
rNextBtn.onclick=function(){ document.getElementById("nextLift").click(); };
document.querySelectorAll(".day").forEach(function(b){
  b.onclick=function(){
    cur=b.getAttribute("data-day");
    idx=0; hintText=""; hintGood=false; view="day";
    clearUndo();
    sAutoStopped=false;
    var list=DAYS[cur].ex;
    for(var i=0;i<list.length;i++){ if(st(cur,i).done<list[i].s){ idx=i; break; } }
    render();
  };
});

/* ── boot ──────────────────────────────────────────────────────────────── */
initTheme();
load();
render();
</script>
</body>
</html>
